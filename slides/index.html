<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slides — WEREVUL</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #fff; color: #111; }
    nav {
      position: sticky; top: 0;
      background: rgba(255,255,255,0.92); backdrop-filter: blur(10px);
      border-bottom: 1px solid #e8e8e8;
      padding: 0 3rem; height: 56px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 3px; color: #111; text-decoration: none; }
    .back { font-size: .8rem; color: #888; text-decoration: none; }
    .back:hover { color: #111; }
    .page { max-width: 860px; margin: 0 auto; padding: 3.5rem 2rem; }
    .page-title { font-family: 'Bebas Neue', sans-serif; font-size: 2.8rem; letter-spacing: 2px; margin-bottom: .5rem; }
    .page-sub { font-size: .85rem; color: #888; margin-bottom: 2.5rem; }
    .file-list { display: flex; flex-direction: column; }
    .file-item {
      display: flex; align-items: center; gap: 1rem;
      padding: 1rem 0; border-bottom: 1px solid #e8e8e8;
      text-decoration: none; color: #111;
      transition: background .15s;
    }
    .file-item:last-child { border-bottom: none; }
    .file-item:hover { background: #f5f5f5; padding-left: .5rem; border-radius: 6px; }
    .file-icon { font-size: 1.3rem; width: 36px; text-align: center; flex-shrink: 0; }
    .file-name { font-size: .9rem; font-weight: 600; }
    .file-desc { font-size: .78rem; color: #888; margin-top: .1rem; }
    .file-date { margin-left: auto; font-size: .75rem; color: #bbb; white-space: nowrap; }
    .empty { color: #bbb; font-size: .9rem; padding: 2rem 0; }
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="/">WEREVUL</a>
  <a class="back" href="/">← Back</a>
</nav>
<div class="page">
  <h1 class="page-title">SLIDES</h1>
  <p class="page-sub">Presentation decks — add files to the /slides folder and list them below.</p>
  <div class="file-list">

    <!-- ── ADD FILES HERE ──────────────────────────────────────────
         Copy a file-item block, update href, name, desc, date.
         Example:
         <a class="file-item" href="werevul-intro.pdf" target="_blank">
           <div class="file-icon">📊</div>
           <div>
             <div class="file-name">WereVul Intro Presentation</div>
             <div class="file-desc">Project kickoff slides — Oct 2025</div>
           </div>
           <div class="file-date">Oct 2025</div>
         </a>
         ──────────────────────────────────────────────────────────── -->

    <a class="file-item" href="werevul-intro.pdf" target="_blank">
      <div class="file-icon">📊</div>
      <div>
        <div class="file-name">WereVul Introduction</div>
        <div class="file-desc">Project overview &amp; system architecture</div>
      </div>
      <div class="file-date">Oct 2025</div>
    </a>

  </div>
</div>
</body>
</html>
